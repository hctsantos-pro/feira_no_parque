<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feira no Parque - Splash</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Logo Feira no Parque.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Estilos base do projeto -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Estilos específicos para a página splash para garantir centralização e sem rolagem */
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      /* Remove barra de rolagem */
      background-color: var(--brand-bg-light);
      /* Cor oficial do fundo */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease-in-out;
    }

    .splash-logo {
      width: 680px;
      /* Logo em tamanho grande */
      max-width: 80vw;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }

    .splash-title {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--brand-purple);
      margin: 0 0 8px 0;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .splash-subtitle {
      font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
      font-size: 1.1rem;
      color: var(--brand-red);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 0;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsividade para telas menores */
    @media (max-width: 768px) {
      .splash-logo {
        width: 220px;
      }

      .splash-title {
        font-size: 2.2rem;
      }

      .splash-subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <div class="splash-container">
    <img src="logo.png" alt="Logo Feira no Parque" class="splash-logo">
    <h1 class="splash-title">Feira no Parque</h1>
    <h2 class="splash-subtitle">Feira de Economia Criativa</h2>
  </div>

</body>

</html>
